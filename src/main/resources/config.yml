# PaulBunyan: chop a natural tree with an axe and it falls over.
# Sneak to chop a single log the normal way.

# What fallen logs turn into when they land: "blocks" to chop up where they lie, or "items".
land-as: blocks

# The tree comes down in one piece. It lands whole on flat ground, and across a gap it lies from one side to the
# other, with up to two logs sticking out past an edge. Anything hanging further over a drop breaks off in sections of
# two to five logs. false lands each log on its own, as before.
one-piece: true

# Uphill, the tree strikes the slope before it's flat and lands short, with its crown crushed into the hill. Over a
# drop it tips past flat before it lands. It always comes to rest flat on the block grid. false tips every tree to flat.
terrain: true

# Logs a fall leaves lying are joined, so any tool breaks them one log at a time, slower than a loose log: this
# percent of normal speed. 100 breaks them like any other log. Fallen logs never fall again when chopped.
fallen-log-speed: 50

# A log that drops further than items-after blocks as it lands breaks into a log item, and further than sticks-after
# splinters into two sticks. A log that lands inside the ground, on a slope it hit, is crushed into a log item.
long-drop:
  items-after: 4
  sticks-after: 12

# Trees with more logs or leaves than this break like vanilla instead of falling.
max-logs: 250
max-leaves: 3000

# Plant a sapling where the tree stood, free, if one can grow there. Only for a cut at the ground: a stump regrows
# by itself (see regrowth below).
replant: true

# Stumps and fallen trees grow back, in in-game days (24000 ticks; a day counts only while the world is loaded).
regrowth:
  # A stump left by a high cut grows into a wild, one-off tree of its own kind. It grows only where every block it
  # needs is air or a small plant, outside any claim and clear of builds, and waits and tries again otherwise.
  stumps: true
  # About this many days after the cut, give or take half again (so a forest doesn't all grow at once).
  stump-days: 3
  # Once a fallen tree's logs are cleared, saplings of its kind may sprout where it lay, on grass or dirt outside claims.
  saplings: true
  # The most places that sprout per tree. Dark and pale oak sprout one square of four, or none.
  sapling-max: 3
  # A sapling that hasn't grown after this many days is removed.
  sapling-days: 30
  # Worlds where nothing regrows, by folder name. (Trees there still fall unless the main disabled-worlds list names the world.)
  disabled-worlds: []
  # With Rewild installed, tell it which saplings and grown trees to keep. Rewild only listens once an admin
  # respects PaulBunyan with /rewild plugins.
  rewild-link: true

# Huge crimson and warped fungi fall too.
nether-fungi: true

# Creative players chop one log like vanilla unless this is true.
creative-fells: false

# How long a tree takes to fall, in ticks (20 a second). 0 skips the animation.
fall-ticks: 24

# Above this many logs and leaves together, leaves vanish at once instead of falling with the tree.
max-animated-blocks: 600

# Worlds where trees never fall, by folder name.
disabled-worlds: []

# Ticks the tree creaks and leans before it goes, so anyone underneath can get clear. 20 is one second; 0 falls at once.
warning-ticks: 20

# What a falling tree does to someone in its way, like difficulty:
#   off  nobody is hurt; they're knocked back or flung clear, harder the bigger the hit (the default)
#   max  falling wood hurts, a log on the head hurts a lot, and the trunk landing on someone kills them
# Players in creative or spectator are never hurt. Set a different level for a world below.
fall-danger: off
fall-danger-worlds: {}
#   world: max

# With GSit installed, players can sit only on logs lying on their side, like a felled trunk: never on upright logs or
# stairs. Also list '#logs' in GSit's own SitMaterials, or GSit won't offer logs at all. Read at startup.
gsit-sideways-logs-only: true
